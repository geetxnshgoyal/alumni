# Render Blueprint: creates the web service and a PostgreSQL database in one click.
# Render dashboard -> New -> Blueprint -> pick this repository.
services:
  - type: web
    name: gec-alumni-platform
    runtime: node
    plan: free
    buildCommand: npm ci
    # Migrations are idempotent, so running them on every start is safe.
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: alumni_db
          property: connectionString
      - key: DATABASE_SSL
        value: "false" # internal Render connection; set "true" for Neon/Supabase
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

databases:
  - name: alumni_db
    plan: free
    databaseName: alumni_db
